name: Test (inference)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

jobs:
  inference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Run inference smoke tests
        run: pytest -m inference --no-cov
