name: Test (without inference)

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Lint
        run: ruff check app tests scripts

      - name: Type check
        run: mypy app

      - name: Run test suite
        run: pytest -m "not inference" --cov=app --cov-report=term-missing --cov-fail-under=80
